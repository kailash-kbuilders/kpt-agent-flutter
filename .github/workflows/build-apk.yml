name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android folder if missing
        run: |
          if [ ! -d android ]; then
            cp pubspec.yaml /tmp/pubspec.yaml
            cp -r lib /tmp/lib
            flutter create --platforms=android --project-name kpt_agent --org com.kailash .
            cp /tmp/pubspec.yaml pubspec.yaml
            rm -rf lib test
            cp -r /tmp/lib lib
          fi

      - name: Configure Android project
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <application android:usesCleartextTraffic="true" android:requestLegacyExternalStorage="true"#' "$MANIFEST"
          sed -i 's/android:label="[^"]*"/android:label="KPT Agent"/' "$MANIFEST"
          sed -i 's/flutter\.minSdkVersion/24/' android/app/build.gradle* || true
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g/' android/gradle.properties || true
          cp -r android_res/* android/app/src/main/res/
          cat "$MANIFEST"

      - name: Gradle fixes (compileSdk)
        run: |
          mkdir -p ~/.gradle/init.d
          cp gradle_fix/fix.gradle ~/.gradle/init.d/fix.gradle

      - run: flutter pub get
      - run: flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: kpt-agent-apk
          path: build/app/outputs/flutter-apk/app-release.apk
