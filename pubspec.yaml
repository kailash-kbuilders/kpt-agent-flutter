name: kpt_agent
description: KPT Agent - autonomous AI Flutter developer workspace for mobile.
publish_to: "none"
version: 1.2.0+1

environment:
  sdk: ">=3.0.0 <5.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ">=1.2.0 <2.0.0"
  path: ">=1.8.0 <2.0.0"
  file_picker: ">=8.0.0 <9.0.0"
  path_provider: ">=2.1.0 <3.0.0"
  shared_preferences: ">=2.2.0 <3.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/templates/pubspec.yaml.tpl
    - assets/templates/main_plain.dart.tpl
    - assets/templates/main_riverpod.dart.tpl
    - assets/templates/main_getx.dart.tpl
    - assets/templates/gitignore.tpl
    - assets/templates/README.md.tpl
    - assets/templates/build-apk.yml.tpl
    - assets/templates/fix.gradle.tpl
